name: Keep Render API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health endpoint
        if: ${{ vars.API_URL != '' }}
        run: curl -fsS --retry 3 --retry-delay 15 --retry-all-errors --max-time 90 "${{ vars.API_URL }}/health"
