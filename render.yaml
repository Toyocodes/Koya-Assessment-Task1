services:
  - type: web
    name: koya-booking-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci -w apps/api --include-workspace-root && npm run build -w apps/api && npm run db:migrate -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: API_KEY
        sync: false
